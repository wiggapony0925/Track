name: Deploy Backend

# Only deploy to Render when backend files actually change.
# This prevents iOS-only pushes from causing unnecessary redeploys
# and 30-90s of 502 downtime during container restart.

on:
  push:
    branches: [main]
    paths:
      - "TrackBackend/**"
      - "render.yaml"

  workflow_dispatch: # allow manual deploy from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render Deploy via API
        run: |
          echo "Backend files changed — triggering Render deploy..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --max-time 30 \
            -X POST "https://api.render.com/v1/services/srv-d662a19r0fns73cgpfog/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Render API returned HTTP $STATUS"
          echo "$BODY" | head -5
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Deploy API failed with HTTP $STATUS"
            exit 1
          fi
          echo "Deploy triggered successfully"
