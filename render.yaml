# render.yaml — Track infrastructure as code
# Render reads this file to provision/sync services.
# Dashboard: https://dashboard.render.com
# Docs: https://render.com/docs/infrastructure-as-code

# ────────────────────────────────────────────────────────────
# Key Value (Redis-compatible) — shared bus cache
# ────────────────────────────────────────────────────────────
keyValueStores:
  - name: track-redis
    plan: starter       # 100 MB — upgraded from free (25 MB) Feb 2026
    region: virginia    # same region as Track web service to minimise latency
    maxmemoryPolicy: allkeys-lru  # evict oldest keys when memory is full

# ────────────────────────────────────────────────────────────
# Web services
# ────────────────────────────────────────────────────────────
services:
  - type: web
    name: Track
    runtime: docker
    region: virginia
    plan: standard        # 2 GB RAM, 1 CPU ($25/mo) — upgraded from starter Mar 2026
    rootDir: TrackBackend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    branch: main
    autoDeploy: false     # DISABLED — iOS-only pushes were causing unnecessary
                          # redeploys + 502 downtime. Use the GitHub Action
                          # (.github/workflows/deploy-backend.yml) instead,
                          # which only triggers when TrackBackend/ files change.
    numInstances: 1

    envVars:
      # ── Redis (Key Value) ──────────────────────────────────
      # Render injects the internal connection string automatically.
      # This is the primary performance lever: enables shared Redis
      # cache across all instances instead of per-process only.
      - key: REDIS_URL
        fromService:
          type: keyValueStore
          name: track-redis
          property: connectionString

      # ── MTA / transit API keys ─────────────────────────────
      # These are secret — set them manually in the Render dashboard
      # under Environment > Secret Files, or as individual env vars.
      # They are listed here (without values) so future engineers know
      # what is required.
      - key: MTA_API_KEY
        sync: false       # value managed in dashboard, not in this file
      - key: OBA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # also accepted as SUPABASE_SERVICE_KEY — same value

      # ── Gunicorn worker count ──────────────────────────────
      # Standard plan: 2 GB RAM → 2 workers (~1 GB each) for true
      # request parallelism.  Each worker has its own async event loop,
      # in-process cache, and thread pool.  Going higher than 2 risks
      # OOM on a 2 GB instance with the ~800 MB transit_schedule.db.
      - key: WEB_CONCURRENCY
        value: "2"

    # ── Render Persistent Disk ─────────────────────────────────────────────
    # Persists app/data/ across deploys so the 809 MB transit_schedule.db
    # and 430 MB bus GTFS are NOT baked into the Docker image.
    # First boot: ensure_data_available() downloads GTFS from Supabase →
    #             rebuild_schedule_db_if_missing() builds transit_schedule.db.
    # Subsequent boots: disk already has the DB — startup is instant.
    disk:
      name: track-data
      mountPath: /app/app/data
      sizeGB: 10
